<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1f" media="(prefers-color-scheme: dark)">
  <title>ไม่พบหน้านี้ | อินทุอร ธีรางกูร</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%236d28d9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- ไฟล์นี้ตั้งใจให้ทำงานได้เดี่ยวๆ (CSS อยู่ในไฟล์ ไม่ใช้ path แบบ css/...) เพราะ GitHub Pages
       แสดงหน้านี้กับทุก URL ที่ไม่มีอยู่ ซึ่ง path แบบสัมพัทธ์จะพัง
       ถ้าเปลี่ยนสีใน css/style.css ให้มาแก้ตรงนี้ด้วย -->
  <style>
    :root { --bg:#f4f4f5; --text:#1f1f23; --muted:#55555e; --accent:#6d28d9; --on-accent:#fff; color-scheme:light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#1c1c1f; --text:#f4f4f5; --muted:#a1a1aa; --accent:#facc15; --on-accent:#1c1c1f; color-scheme:dark; }
    }
    :root[data-theme="dark"] { --bg:#1c1c1f; --text:#f4f4f5; --muted:#a1a1aa; --accent:#facc15; --on-accent:#1c1c1f; color-scheme:dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text); line-height: 1.7;
      font-family: "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
      display: grid; place-items: center; padding: 2rem;
    }
    main { max-width: 32rem; }
    .dot { display: inline-block; width: .8rem; height: .8rem; border-radius: 50%; background: var(--accent); margin-bottom: 1rem; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.25; }
    p { margin: 0 0 1.75rem; color: var(--muted); font-size: 1.1rem; }
    a.btn {
      display: inline-block; background: var(--accent); color: var(--on-accent); font-weight: 700;
      text-decoration: none; padding: .75rem 1.6rem; border-radius: 8px;
    }
    a.btn:hover { filter: brightness(1.1); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  </style>
  <script>
    // ใช้โหมดสว่าง/มืดที่ผู้เข้าชมเลือกไว้ในหน้าหลัก
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <main>
    <span class="dot" aria-hidden="true"></span>
    <h1>ไม่พบหน้านี้</h1>
    <p>ลิงก์อาจพิมพ์ผิดหรือหน้านี้ถูกย้ายไปแล้ว กลับไปดูผลงานของ <span style="white-space:nowrap">อินทุอร ธีรางกูร</span> ได้ที่หน้าแรก</p>
    <a class="btn" href="/">กลับหน้าแรก</a>
  </main>
</body>
</html>
